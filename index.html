<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>MÉXICO | Revista Digital</title>

    <link rel="stylesheet" href="css/magazine.css">
</head>

<body>

<div class="app">

    <header class="topbar">

        <div class="brand">
            MÉXICO
            <span>Revista Digital</span>
        </div>

        <div class="edition">
            EDICIÓN 01
        </div>

    </header>


    <main class="reader">

        <button
            class="nav-button prev"
            id="prevButton"
        >
            ‹
        </button>


        <div class="stage">

            <div class="magazine" id="magazine">

                <!-- SOMBRA GENERAL -->

                <div class="book-shadow"></div>


                <!-- =========================
                     PÁGINA IZQUIERDA
                ========================== -->

                <section
                    class="page-slot left-slot"
                    id="leftSlot"
                >
                </section>


                <!-- =========================
                     LOMO
                ========================== -->

                <div class="spine">

                    <div class="spine-light"></div>

                    <div class="spine-shadow"></div>

                </div>


                <!-- =========================
                     PÁGINA DERECHA
                ========================== -->

                <section
                    class="page-slot right-slot"
                    id="rightSlot"
                >
                </section>

                <div
    class="page-cast-shadow"
    id="pageCastShadow"
></div>


                <!-- =========================
                     HOJA ANIMADA
                ========================== -->

                <div
                    class="turning-sheet"
                    id="turningSheet"
                >

                    <div
                        class="turn-page turn-front"
                        id="turnFront"
                    >
                    </div>

                    <div
                        class="turn-page turn-back"
                        id="turnBack"
                    >
                    </div>

                </div>

            </div>

        </div>


        <button
            class="nav-button next"
            id="nextButton"
        >
            ›
        </button>

    </main>


    <footer class="controls">

        <button id="coverButton">
            PORTADA
        </button>

        <div class="counter">
            <span id="pageCounter">
                01
            </span>

            <span class="slash">
                /
            </span>

            <span id="totalCounter">
                08
            </span>
        </div>

        <button id="fullscreenButton">
            ⛶
        </button>

    </footer>

</div>


<script src="js/magazine.js"></script>

</body>
</html>
